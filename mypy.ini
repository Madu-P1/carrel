[mypy]
python_version = 3.11
warn_unused_configs = True
files = app_runtime.py, app_logging.py, ai/router.py, benchmarks, evals
follow_imports = silent
ignore_missing_imports = True

[mypy-app_runtime]
strict = True

[mypy-app_logging]
strict = True

[mypy-ai.router]
strict = True

[mypy-benchmarks.*]
strict = True

[mypy-evals.*]
strict = True
