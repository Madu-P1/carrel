[mypy]
python_version = 3.11
warn_unused_configs = True
files = app_runtime.py, app_logging.py, ai/router.py, benchmarks, evals
# Keep `mypy .` aligned with the release gate above. The codebase is moving
# toward wider typing, but today the supported gate is these typed islands;
# passing "." should not accidentally pull every legacy route/service/test
# module into strict mode and drown release checks in known historical debt.
exclude = ^(\./)?(?!app_runtime\.py$|app_logging\.py$|ai/router\.py$|benchmarks/|evals/).*
follow_imports = silent
ignore_missing_imports = True

[mypy-app_runtime]
strict = True

[mypy-app_logging]
strict = True

[mypy-ai.router]
strict = True

[mypy-benchmarks.*]
strict = True

[mypy-evals.*]
strict = True
