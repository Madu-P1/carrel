<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Bricolage';src:url('../fonts/bricolage-var.woff2') format('woff2');font-weight:400 800;font-display:block;}
@font-face{font-family:'PlexMono';src:url('../fonts/ibm-plex-mono-500.woff2') format('woff2');font-weight:500;font-display:block;}
*{margin:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;}
body{background:#f2ede3;color:#221c15;font-family:'Bricolage',sans-serif;position:relative;overflow:hidden;}
.pad{position:absolute;inset:0;padding:74px 84px;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:16px;}
.brand svg{width:60px;height:60px;display:block;}
.brand .word{font-weight:700;font-size:50px;letter-spacing:-0.03em;line-height:1;}
.eyebrow{font-family:'PlexMono',monospace;font-weight:500;font-size:20px;letter-spacing:0.14em;text-transform:uppercase;color:#6e1a28;margin-top:auto;}
h1{font-weight:700;font-size:84px;line-height:0.97;letter-spacing:-0.035em;margin-top:20px;max-width:1010px;}
h1 .ox{color:#6e1a28;}
.foot{display:flex;align-items:center;gap:16px;margin-top:34px;}
.foot .rule{height:1.5px;width:54px;background:#6e1a28;opacity:0.5;}
.foot .url{font-family:'PlexMono',monospace;font-size:23px;color:#8a7f70;letter-spacing:0.02em;}
</style></head><body>
<div class="pad">
  <div class="brand">
    <svg viewBox="0 0 240 240" aria-hidden="true"><g fill="none" stroke="#6e1a28" stroke-linecap="butt" stroke-width="22"><path d="M174.25 86.02 A64 64 0 0 1 80.53 69.56"/><path d="M64.53 88.00 A64 64 0 0 0 174.25 153.98"/></g></svg>
    <span class="word">Cachet</span>
  </div>
  <div class="eyebrow">For litigators filing AI-assisted briefs</div>
  <h1>Check your AI-drafted brief <span class="ox">before you file.</span></h1>
  <div class="foot"><span class="rule"></span><span class="url">cachetverify.com</span></div>
</div>
</body></html>
