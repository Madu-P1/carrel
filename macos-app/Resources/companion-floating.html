<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrel Companion</title>
<style>
:root {
  --color-bg-elevated: rgba(22, 22, 26, 0.92);
  --color-border-subtle: rgba(255, 255, 255, 0.06);
  --color-border-default: rgba(255, 255, 255, 0.10);
  --color-text-primary: #f5f5f7;

  --color-teal:        #5eead4;
  --color-teal-bright: #99f6e4;
  --color-teal-15: rgba(94, 234, 212, 0.15);
  --color-teal-30: rgba(94, 234, 212, 0.30);
  --color-teal-50: rgba(94, 234, 212, 0.50);

  --dur-fast: 120ms; --dur-base: 180ms; --dur-medium: 280ms;
  --dur-long: 640ms;

  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --ease-soft:   cubic-bezier(0.65, 0, 0.35, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--color-text-primary);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  cursor: grab;
}
body.dragging { cursor: grabbing; }

/* Stage is the full panel area. No chrome — the cube IS the visible.
 * The transparent surrounding space stays interactive so the user can
 * grab the cube anywhere within the panel's bounding box, which makes
 * dragging forgiving on small targets. */
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  perspective: 1400px;
  perspective-origin: 50% 45%;
}

/* Cube anchor — 100px edge. Margin = -half edge. */
.anchor {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100px;
  height: 100px;
  margin-left: -50px;
  margin-top: -50px;
  transform-style: preserve-3d;
  transition:
    transform var(--dur-medium) var(--ease-soft),
    opacity var(--dur-medium) var(--ease-soft);
  z-index: 2;
}

.cube3d {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: rotateX(-12deg) rotateY(-12deg);
  transition: transform var(--dur-long) var(--ease-soft);
}

.drift {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: rotateY(0deg);
}
.drift.spinning { animation: cubeIdleDrift 60s linear infinite; }

/* While the user is dragging the panel, blow through the idle drift
 * with a fast Y-axis spin. The !important is intentional — it wins
 * over .spinning regardless of which state was active when the drag
 * started. */
body.dragging .drift {
  animation: cubeDragSpin 0.45s linear infinite !important;
}

/* Alarm — scheduled study session is now. Chaotic 3-axis spin so the
 * cube reads as urgent peripheral motion. Sticks until the user taps
 * the panel; tap clears `body.alarm` via the Swift bridge. */
body.alarm .cube3d {
  animation: cubeAlarmSpin 0.55s linear infinite !important;
}
body.alarm .drift {
  animation: cubeDragSpin 0.30s linear infinite !important;
}
body.alarm .face {
  box-shadow:
    inset 0 0 0 1px var(--color-teal-50),
    0 0 36px var(--color-teal-50);
}
body.alarm .aura {
  opacity: 1 !important;
  animation: cubeAlarmAura 0.9s ease-in-out infinite alternate;
}
@keyframes cubeAlarmSpin {
  0%   { transform: rotateX(0deg)   rotateY(0deg)   rotateZ(0deg); }
  25%  { transform: rotateX(90deg)  rotateY(90deg)  rotateZ(45deg); }
  50%  { transform: rotateX(180deg) rotateY(180deg) rotateZ(90deg); }
  75%  { transform: rotateX(270deg) rotateY(270deg) rotateZ(135deg); }
  100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
}
@keyframes cubeAlarmAura {
  from { opacity: 0.55; }
  to   { opacity: 1; }
}

/* Drop-target state — applied while a file drag is hovering the panel.
 * Strong teal aura + a slow celebratory spin so the user sees the cube
 * is ready to receive. The actual upload kicks the cube into 'thinking'
 * via the Swift bridge once the drop fires. */
body.drop-ready .drift {
  animation: cubeDragSpin 1.8s linear infinite !important;
}
body.drop-ready .face {
  box-shadow:
    inset 0 0 0 1px var(--color-teal-50),
    0 0 28px var(--color-teal-30);
}

@keyframes cubeIdleDrift {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(360deg); }
}
@keyframes cubeDragSpin {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(360deg); }
}

.face {
  position: absolute;
  width: 100px;
  height: 100px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: 6px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px;
  padding: 6px;
  backface-visibility: hidden;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
  transition: box-shadow var(--dur-medium) var(--ease-soft);
}

.face.active-face {
  box-shadow:
    inset 0 0 0 1px var(--color-teal-30),
    0 0 32px var(--color-teal-15);
}

/* Half-edge = 50px (face is 100x100) */
.face-front  { transform: translateZ(50px); }
.face-back   { transform: rotateY(180deg) translateZ(50px); }
.face-right  { transform: rotateY(90deg)  translateZ(50px); }
.face-left   { transform: rotateY(-90deg) translateZ(50px); }
.face-top    { transform: rotateX(90deg)  translateZ(50px); }
.face-bottom { transform: rotateX(-90deg) translateZ(50px); }

.cell {
  background: transparent;
  border: 1px solid var(--color-border-subtle);
  border-radius: 4px;
  transition:
    background var(--dur-medium) var(--ease-soft),
    border-color var(--dur-medium) var(--ease-soft),
    box-shadow var(--dur-fast) var(--ease-out);
}
.cell.outlined { border-color: var(--color-border-default); }
.cell.filled   { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.14); }
.cell.bright   { background: var(--color-text-primary); border-color: transparent; }
.cell.dim      { background: rgba(255, 255, 255, 0.025); border-color: rgba(255, 255, 255, 0.04); }

.cell.teal-outlined { border-color: var(--color-teal-30); }
.cell.teal-filled   { background: var(--color-teal-15); border-color: var(--color-teal-30); }
.cell.teal-bright {
  background: var(--color-teal);
  border-color: transparent;
  box-shadow: 0 0 12px var(--color-teal-50);
}
.cell.teal-dim { background: rgba(94, 234, 212, 0.04); border-color: rgba(94, 234, 212, 0.08); }

.cell.ambient { animation: cubeAmbientPulse 1.6s var(--ease-soft); }
@keyframes cubeAmbientPulse {
  0%   { background: rgba(255, 255, 255, 0.025); }
  50%  { background: var(--color-teal-15); border-color: var(--color-teal-30); }
  100% { background: rgba(255, 255, 255, 0.025); }
}

@keyframes cubeStumpedShake {
  0%, 100% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(0deg); }
  20% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(-2deg); }
  40% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(2deg); }
  60% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(-1.5deg); }
  80% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(1deg); }
}

.aura {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 160px;
  height: 160px;
  margin-left: -80px;
  margin-top: -80px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--color-teal-30) 0%, transparent 65%);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur-long) var(--ease-soft);
  z-index: 1;
}
.aura.glowing { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .anchor, .cube3d, .drift, .face, .cell, .aura {
    transition-duration: 60ms !important;
    animation: none !important;
  }
}
</style>
</head>
<body>

<div class="stage">
  <div class="aura" id="aura"></div>
  <div class="anchor" id="anchor">
    <div class="cube3d" id="cube3d">
      <div class="drift" id="drift">
        <div class="face face-front"  data-face="front"></div>
        <div class="face face-back"   data-face="back"></div>
        <div class="face face-right"  data-face="right"></div>
        <div class="face face-left"   data-face="left"></div>
        <div class="face face-top"    data-face="top"></div>
        <div class="face face-bottom" data-face="bottom"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const FACE_DEFAULTS = {
  front:  ['.', 'o', '.',  'o', 'b', 'o',  '.', 'o', '.'],
  top:    ['.', 'b', '.',  '.', 'b', '.',  '.', 'b', '.'],
  right:  ['o', '.', 'o',  '.', 'b', '.',  'o', '.', 'o'],
  back:   ['.', '.', '.',  '.', 'o', '.',  '.', '.', '.'],
  left:   ['b', 'b', 'o',  'b', 'o', 'o',  'o', 'o', 'o'],
  bottom: ['b', '.', 'b',  '.', 'b', '.',  'b', '.', 'b'],
};
const CELL_CLASS = { '.': '', o: 'outlined', f: 'filled', b: 'bright', d: 'dim' };
const CELL_CLASS_TEAL = { '.': '', o: 'teal-outlined', f: 'teal-filled', b: 'teal-bright', d: 'teal-dim' };

const STATES = {
  idle:         { rotateX: -14, rotateY:  -18, activeFace: 'front',  scale: 1,    opacity: 1,    behavior: 'idleTwinkle',  ambient: true,  drift: true },
  focused:      { rotateX: -78, rotateY:  -18, activeFace: 'top',    scale: 1.05, opacity: 1,    behavior: 'focusColumn',  ambient: true },
  thinking:     { rotateX: -14, rotateY:  -78, activeFace: 'right',  scale: 1,    opacity: 1,    behavior: 'thinkSweep',   ambient: true },
  citeChecking: { rotateX:  -8, rotateY:  -98, activeFace: 'right',  scale: 1,    opacity: 1,    behavior: 'citeScan' },
  encouraging:  { rotateX: -14, rotateY:   80, activeFace: 'left',   scale: 1.04, opacity: 1,    behavior: 'cardGood',  auraOnEntry: true },
  stumped:      { rotateX: -14, rotateY:   80, activeFace: 'left',   scale: 0.98, opacity: 1,    behavior: 'cardAgain', shakeOnEntry: true },
  break:        { rotateX: -14, rotateY:  168, activeFace: 'back',   scale: 0.96, opacity: 0.95, behavior: 'breakDrain' },
  sleeping:     { rotateX:  78, rotateY:  -18, activeFace: 'bottom', scale: 0.92, opacity: 0.7,  behavior: 'sleepGlimmer', drift: true },
  streak:       { rotateX: -14, rotateY:  -18, activeFace: 'front',  scale: 1.08, opacity: 1,    behavior: 'streakSpin', auraOnEntry: true },
};

const faces = {};
document.querySelectorAll('.face').forEach((face) => {
  const name = face.dataset.face;
  faces[name] = face;
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.face = name;
    cell.dataset.idx = i;
    face.appendChild(cell);
  }
});

const anchor = document.getElementById('anchor');
const cube3d = document.getElementById('cube3d');
const drift = document.getElementById('drift');
const aura = document.getElementById('aura');

let currentState = 'idle';
const timers = [];
let ambientTimer = null;

function clearTimers() {
  timers.forEach(clearTimeout);
  timers.length = 0;
  if (ambientTimer) { clearTimeout(ambientTimer); ambientTimer = null; }
}

function applyPattern(faceName, pattern, useTeal) {
  const cells = faces[faceName].children;
  const map = useTeal ? CELL_CLASS_TEAL : CELL_CLASS;
  for (let i = 0; i < 9; i++) {
    const cell = cells[i];
    cell.className = 'cell';
    const cls = map[pattern[i]];
    if (cls) cell.classList.add(cls);
  }
}

function applyAllPatterns(activeFace) {
  Object.keys(FACE_DEFAULTS).forEach((name) => {
    applyPattern(name, FACE_DEFAULTS[name], name === activeFace);
  });
  Object.values(faces).forEach((f) => f.classList.remove('active-face'));
  if (faces[activeFace]) faces[activeFace].classList.add('active-face');
}

function startAmbient(activeFace) {
  function pulse() {
    const otherFaces = Object.keys(faces).filter((f) => f !== activeFace);
    const face = otherFaces[Math.floor(Math.random() * otherFaces.length)];
    const cells = faces[face].children;
    const idx = Math.floor(Math.random() * 9);
    const cell = cells[idx];
    cell.classList.add('ambient');
    timers.push(setTimeout(() => cell.classList.remove('ambient'), 1700));
    ambientTimer = setTimeout(pulse, 3500 + Math.random() * 2500);
  }
  ambientTimer = setTimeout(pulse, 2000);
}

const BEHAVIORS = {
  idleTwinkle() {
    const positions = [0, 1, 2, 3, 5, 6, 7, 8];
    function tick() {
      if (currentState !== 'idle') return;
      const pos = positions[Math.floor(Math.random() * positions.length)];
      const cell = faces.front.children[pos];
      const orig = cell.className;
      cell.className = 'cell teal-bright';
      timers.push(setTimeout(() => { cell.className = orig; }, 700));
      timers.push(setTimeout(tick, 2200 + Math.random() * 1800));
    }
    timers.push(setTimeout(tick, 1500));
  },
  focusColumn() {
    const cells = faces.top.children;
    [1, 4, 7].forEach((i) => cells[i].className = 'cell teal-filled');
    [0, 2, 3, 5, 6, 8].forEach((i) => cells[i].className = 'cell');
    function pulse() {
      if (currentState !== 'focused') return;
      [1, 4, 7].forEach((idx, n) => {
        timers.push(setTimeout(() => {
          if (currentState !== 'focused') return;
          cells[idx].className = 'cell teal-bright';
          timers.push(setTimeout(() => { cells[idx].className = 'cell teal-filled'; }, 320));
        }, n * 220));
      });
      timers.push(setTimeout(pulse, 1600));
    }
    pulse();
  },
  thinkSweep() {
    const cells = faces.right.children;
    const seq = [0, 8, 2, 6, 4];
    function pulse() {
      if (currentState !== 'thinking') return;
      seq.forEach((idx, n) => {
        timers.push(setTimeout(() => {
          if (currentState !== 'thinking') return;
          const old = cells[idx].className;
          cells[idx].className = 'cell teal-bright';
          timers.push(setTimeout(() => { cells[idx].className = old; }, 260));
        }, n * 200));
      });
      timers.push(setTimeout(pulse, 1700));
    }
    pulse();
  },
  citeScan() {
    const cells = faces.right.children;
    function scan() {
      if (currentState !== 'citeChecking') return;
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const idx = row * 3 + col;
          timers.push(setTimeout(() => {
            if (currentState !== 'citeChecking') return;
            const old = cells[idx].className;
            cells[idx].className = 'cell teal-bright';
            timers.push(setTimeout(() => { cells[idx].className = old; }, 220));
          }, (row * 3 + col) * 90));
        }
      }
      timers.push(setTimeout(scan, 1300));
    }
    scan();
  },
  cardGood() {
    const cells = faces.left.children;
    const order = [0, 1, 2, 5, 8, 7, 6, 3, 4];
    order.forEach((idx, n) => {
      timers.push(setTimeout(() => { cells[idx].className = 'cell teal-bright'; }, n * 60));
    });
    timers.push(setTimeout(() => {
      if (currentState !== 'encouraging') return;
      const pat = FACE_DEFAULTS.left;
      for (let i = 0; i < 9; i++) {
        if (i === 2 || i === 5) cells[i].className = 'cell teal-bright';
        else cells[i].className = 'cell ' + (CELL_CLASS_TEAL[pat[i]] || '');
      }
    }, 700));
  },
  cardAgain() {
    const cells = faces.left.children;
    for (let i = 8; i >= 0; i--) {
      if (cells[i].classList.contains('teal-bright')) {
        cells[i].className = 'cell teal-outlined';
        return;
      }
    }
  },
  breakDrain() {
    const cells = faces.back.children;
    [4, 1, 3, 5, 7, 0, 2, 6, 8].forEach((idx, n) => {
      timers.push(setTimeout(() => { cells[idx].className = 'cell dim'; }, n * 180));
    });
  },
  sleepGlimmer() {
    const cells = faces.bottom.children;
    for (let i = 0; i < 9; i++) {
      if (FACE_DEFAULTS.bottom[i] === 'b') cells[i].className = 'cell dim';
    }
    function glimmer() {
      if (currentState !== 'sleeping') return;
      const idx = Math.floor(Math.random() * 9);
      const old = cells[idx].className;
      cells[idx].className = 'cell teal-filled';
      timers.push(setTimeout(() => { cells[idx].className = old; }, 1400));
      timers.push(setTimeout(glimmer, 8000 + Math.random() * 4000));
    }
    timers.push(setTimeout(glimmer, 4000));
  },
  streakSpin() {
    const cells = faces.front.children;
    const order = [0, 1, 2, 5, 8, 7, 6, 3, 4];
    order.forEach((idx, n) => {
      timers.push(setTimeout(() => { cells[idx].className = 'cell teal-bright'; }, n * 70));
    });
    timers.push(setTimeout(() => {
      if (currentState !== 'streak') return;
      const cfg = STATES.streak;
      cube3d.style.transition = 'transform 1.6s cubic-bezier(0.65, 0, 0.35, 1)';
      cube3d.style.transform = `rotateX(${cfg.rotateX}deg) rotateY(${cfg.rotateY + 360}deg)`;
      timers.push(setTimeout(() => {
        cube3d.style.transition = `transform var(--dur-long) var(--ease-soft)`;
        cube3d.style.transform = `rotateX(${cfg.rotateX}deg) rotateY(${cfg.rotateY}deg)`;
      }, 1700));
    }, 700));
  },
};

function applyState(name) {
  const cfg = STATES[name];
  if (!cfg) return;
  currentState = name;
  clearTimers();

  cube3d.style.setProperty('--rx', cfg.rotateX + 'deg');
  cube3d.style.setProperty('--ry', cfg.rotateY + 'deg');
  cube3d.style.transition = `transform var(--dur-long) var(--ease-soft)`;
  cube3d.style.transform = `rotateX(${cfg.rotateX}deg) rotateY(${cfg.rotateY}deg)`;
  anchor.style.transform = `scale(${cfg.scale})`;
  anchor.style.opacity = cfg.opacity;

  applyAllPatterns(cfg.activeFace);

  if (cfg.drift) drift.classList.add('spinning');
  else drift.classList.remove('spinning');

  if (cfg.auraOnEntry) {
    aura.classList.add('glowing');
    timers.push(setTimeout(() => aura.classList.remove('glowing'), 2400));
  } else {
    aura.classList.remove('glowing');
  }

  if (cfg.shakeOnEntry) {
    cube3d.style.animation = 'cubeStumpedShake 0.6s var(--ease-out)';
    timers.push(setTimeout(() => { cube3d.style.animation = ''; }, 700));
  }

  if (BEHAVIORS[cfg.behavior]) {
    timers.push(setTimeout(() => BEHAVIORS[cfg.behavior](), 450));
  }
  if (cfg.ambient) startAmbient(cfg.activeFace);
}

let alarmActive = false;
window.companion = {
  setState(name) { applyState(name); },
  getState() { return currentState; },
  setStreakDays(_n) { /* pill removed; kept for bridge compat */ },
  /** Toggle drop-target visual state. Swift's DropAcceptingWebView
   *  calls this on dragEntered / dragExited / performDragOperation. */
  setDropping(active) {
    document.body.classList.toggle('drop-ready', !!active);
    if (active) { aura.classList.add('glowing'); }
    else { aura.classList.remove('glowing'); }
  },
  /** Alarm — orthogonal to STATES. Swift drives this when a
   *  scheduled study session is due. Tap on the panel dismisses
   *  (Swift posts {action:'tap'} which the host treats as ack). */
  setAlarm(active) {
    alarmActive = !!active;
    document.body.classList.toggle('alarm', alarmActive);
  },
  isAlarming() { return alarmActive; },
};

document.addEventListener('visibilitychange', () => {
  document.querySelectorAll('*').forEach((el) => {
    try {
      el.getAnimations().forEach((a) => document.hidden ? a.pause() : a.play());
    } catch (e) { /* not supported */ }
  });
});

applyState('idle');

// ============================================================
// Drag + tap bridge.
//
// WKWebView swallows mouse events before they reach the NSPanel, so
// the panel's built-in isMovableByWindowBackground does nothing here.
// We capture pointer events in JS, post incremental deltas to the
// "companionShell" handler, and Swift moves the panel via
// setFrameOrigin. A short, threshold-gated mousedown→mouseup with no
// movement fires a "tap" instead of a drag.
// ============================================================
const shellBridge = window.webkit?.messageHandlers?.companionShell;
function postShell(payload) {
  try { shellBridge?.postMessage(payload); }
  catch (e) { console.error('companionShell bridge failed', e); }
}

const DRAG_THRESHOLD_PX = 3;
let dragActive = false;
let dragMoved = false;
let lastScreen = null;

window.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragActive = true;
  dragMoved = false;
  lastScreen = { x: e.screenX, y: e.screenY };
});

window.addEventListener('pointermove', (e) => {
  if (!dragActive) return;
  const dx = e.screenX - lastScreen.x;
  const dy = e.screenY - lastScreen.y;
  if (!dragMoved) {
    if (Math.hypot(dx, dy) < DRAG_THRESHOLD_PX) return;
    dragMoved = true;
    document.body.classList.add('dragging');
    postShell({ action: 'dragStart' });
  }
  postShell({ action: 'dragMove', dx, dy });
  lastScreen = { x: e.screenX, y: e.screenY };
});

function endDrag() {
  if (!dragActive) return;
  const moved = dragMoved;
  dragActive = false;
  dragMoved = false;
  document.body.classList.remove('dragging');
  if (moved) postShell({ action: 'dragEnd' });
  else postShell({ action: 'tap' });
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
</script>
</body>
</html>
