<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrel Companion</title>
<style>
:root {
  /* ---- color tokens ----------------------------------------------------- */
  --color-bg-elevated: rgba(22, 22, 26, 0.92);
  --color-border-subtle: rgba(255, 255, 255, 0.06);
  --color-border-default: rgba(255, 255, 255, 0.10);
  --color-text-primary: #f5f5f7;

  /* Cell-fill tokens used by .cell.filled / .cell.dim / inset shadows.
   * Pulled out of hardcoded rgba(255,255,255,X) literals so the entire
   * cube can flip on prefers-color-scheme: light without per-rule
   * overrides. (T1.2 — Path A.) */
  --color-cell-fill:        rgba(255, 255, 255, 0.10);
  --color-cell-fill-border: rgba(255, 255, 255, 0.14);
  --color-cell-dim:         rgba(255, 255, 255, 0.025);
  --color-cell-dim-border:  rgba(255, 255, 255, 0.04);
  --color-face-inset:       rgba(255, 255, 255, 0.02);

  --color-teal:        #5eead4;
  --color-teal-bright: #99f6e4;
  --color-teal-15: rgba(94, 234, 212, 0.15);
  --color-teal-30: rgba(94, 234, 212, 0.30);
  --color-teal-50: rgba(94, 234, 212, 0.50);

  /* ---- transition durations -------------------------------------------- */
  --dur-fast: 120ms; --dur-base: 180ms; --dur-medium: 280ms;
  --dur-long: 640ms;

  /* ---- spin durations (keyframe-driven) -------------------------------- */
  /* alarm spin slowed from 0.55s (~109 RPM, vestibular hazard) to 0.9s
   * (~67 RPM). Still reads as urgent peripheral motion. */
  --spin-alarm: 0.9s;
  --spin-alarm-drift: 0.45s;
  --spin-alarm-aura: 0.9s;
  --spin-drag: 0.45s;
  --spin-drop-ready: 1.8s;
  --spin-shake: 0.6s;
  --drift-idle: 60s;

  /* ---- easing ---------------------------------------------------------- */
  --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
  --ease-soft:   cubic-bezier(0.65, 0, 0.35, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}

/* Light-mode overrides. macOS users on Light Appearance saw a dark
 * cube floating against a light desktop — visually loud and out of
 * step with system appearance. Flipping the neutral tokens here keeps
 * the teal accents (which work on both grounds) but inverts the
 * neutral surface and cell fills. The cube face becomes near-white
 * translucent, cells become subtly dark, and `.cell.bright` flips
 * automatically because it binds to --color-text-primary.
 *
 * Path A only — re-evaluation does not happen if the user toggles
 * appearance with the panel open. Path B (Swift pushes effective
 * appearance into a CSS data attribute) is a follow-up; in practice
 * the panel is always open during the user's normal session and they
 * don't toggle Light/Dark mid-session. (T1.2 — Path A.)
 */
@media (prefers-color-scheme: light) {
  :root {
    --color-bg-elevated:      rgba(247, 247, 250, 0.92);
    --color-border-subtle:    rgba(0, 0, 0, 0.06);
    --color-border-default:   rgba(0, 0, 0, 0.10);
    --color-text-primary:     #1c1c1e;
    --color-cell-fill:        rgba(0, 0, 0, 0.08);
    --color-cell-fill-border: rgba(0, 0, 0, 0.12);
    --color-cell-dim:         rgba(0, 0, 0, 0.03);
    --color-cell-dim-border:  rgba(0, 0, 0, 0.05);
    --color-face-inset:       rgba(0, 0, 0, 0.02);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--color-text-primary);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  cursor: grab;
}
body.dragging { cursor: grabbing; }

/* Stage is the full panel area. No chrome — the cube IS the visible.
 * The transparent surrounding space stays interactive so the user can
 * grab the cube anywhere within the panel's bounding box, which makes
 * dragging forgiving on small targets. */
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  perspective: 1400px;
  perspective-origin: 50% 50%;
}

/* Cube anchor — 100px edge. Margin = -half edge. */
.anchor {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100px;
  height: 100px;
  margin-left: -50px;
  margin-top: -50px;
  transform-style: preserve-3d;
  transition:
    transform var(--dur-medium) var(--ease-soft),
    opacity var(--dur-medium) var(--ease-soft);
  z-index: 2;
}

.cube3d {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: rotateX(-12deg) rotateY(-12deg);
  transition: transform var(--dur-long) var(--ease-soft);
}

.drift {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transform: rotateY(0deg);
}
.drift.spinning {
  /* ease-in-out eliminates the visible "stutter" at the keyframe loop
   * point that linear had. The 60s period is long enough that ease
   * curves are imperceptible per-frame but smooth at loop points. */
  animation: cubeIdleDrift var(--drift-idle) ease-in-out infinite;
}

/* While the user is dragging the panel, blow through the idle drift
 * with a fast Y-axis spin. The !important is intentional — it wins
 * over .spinning regardless of which state was active when the drag
 * started. */
body.dragging .drift {
  animation: cubeDragSpin var(--spin-drag) linear infinite !important;
}

/* Alarm — scheduled study session is now. Chaotic 3-axis spin so the
 * cube reads as urgent peripheral motion. Sticks until the user taps
 * the panel; tap clears `body.alarm` via the Swift bridge. */
body.alarm .cube3d {
  animation: cubeAlarmSpin var(--spin-alarm) linear infinite !important;
}
body.alarm .drift {
  animation: cubeDragSpin var(--spin-alarm-drift) linear infinite !important;
}
body.alarm .face {
  box-shadow:
    inset 0 0 0 1px var(--color-teal-50),
    0 0 36px var(--color-teal-50);
}
body.alarm .aura {
  opacity: 1 !important;
  animation: cubeAlarmAura var(--spin-alarm-aura) ease-in-out infinite alternate;
}
@keyframes cubeAlarmSpin {
  0%   { transform: rotateX(0deg)   rotateY(0deg)   rotateZ(0deg); }
  25%  { transform: rotateX(90deg)  rotateY(90deg)  rotateZ(45deg); }
  50%  { transform: rotateX(180deg) rotateY(180deg) rotateZ(90deg); }
  75%  { transform: rotateX(270deg) rotateY(270deg) rotateZ(135deg); }
  100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
}
@keyframes cubeAlarmAura {
  from { opacity: 0.55; }
  to   { opacity: 1; }
}

/* Drop-target state — applied while a file drag is hovering the panel.
 * Strong teal aura + a slow celebratory spin so the user sees the cube
 * is ready to receive. The actual upload kicks the cube into 'thinking'
 * via the Swift bridge once the drop fires. */
body.drop-ready .drift {
  animation: cubeDragSpin var(--spin-drop-ready) linear infinite !important;
}
body.drop-ready .face {
  box-shadow:
    inset 0 0 0 1px var(--color-teal-50),
    0 0 28px var(--color-teal-30);
}

@keyframes cubeIdleDrift {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(360deg); }
}
@keyframes cubeDragSpin {
  from { transform: rotateY(0deg); }
  to   { transform: rotateY(360deg); }
}

.face {
  position: absolute;
  width: 100px;
  height: 100px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-default);
  border-radius: 6px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 3px;
  padding: 6px;
  backface-visibility: hidden;
  /* No `overflow: hidden` here — the teal-bright cells deliberately
   * bleed their glow past the face edge for atmosphere. Adversarial
   * review flagged the audit's "subtle bleed" finding as cosmetic
   * (LOW); clipping it removed visible polish. */
  box-shadow: inset 0 0 0 1px var(--color-face-inset);
  transition: box-shadow var(--dur-medium) var(--ease-soft);
}

.face.active-face {
  box-shadow:
    inset 0 0 0 1px var(--color-teal-30),
    0 0 32px var(--color-teal-15);
}

/* Half-edge = 50px (face is 100x100) */
.face-front  { transform: translateZ(50px); }
.face-back   { transform: rotateY(180deg) translateZ(50px); }
.face-right  { transform: rotateY(90deg)  translateZ(50px); }
.face-left   { transform: rotateY(-90deg) translateZ(50px); }
.face-top    { transform: rotateX(90deg)  translateZ(50px); }
.face-bottom { transform: rotateX(-90deg) translateZ(50px); }

.cell {
  background: transparent;
  border: 1px solid var(--color-border-subtle);
  border-radius: 4px;
  transition:
    background var(--dur-medium) var(--ease-soft),
    border-color var(--dur-medium) var(--ease-soft),
    box-shadow var(--dur-fast) var(--ease-out);
}
.cell.outlined { border-color: var(--color-border-default); }
.cell.filled   { background: var(--color-cell-fill); border-color: var(--color-cell-fill-border); }
.cell.bright   { background: var(--color-text-primary); border-color: transparent; }
.cell.dim      { background: var(--color-cell-dim); border-color: var(--color-cell-dim-border); }

.cell.teal-outlined { border-color: var(--color-teal-30); }
.cell.teal-filled   { background: var(--color-teal-15); border-color: var(--color-teal-30); }
.cell.teal-bright {
  background: var(--color-teal);
  border-color: transparent;
  box-shadow: 0 0 12px var(--color-teal-50);
}
.cell.teal-dim { background: rgba(94, 234, 212, 0.04); border-color: rgba(94, 234, 212, 0.08); }

.cell.ambient { animation: cubeAmbientPulse 1.6s var(--ease-soft); }
@keyframes cubeAmbientPulse {
  0%   { background: var(--color-cell-dim); }
  50%  { background: var(--color-teal-15); border-color: var(--color-teal-30); }
  100% { background: var(--color-cell-dim); }
}

@keyframes cubeStumpedShake {
  0%, 100% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(0deg); }
  20% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(-2deg); }
  40% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(2deg); }
  60% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(-1.5deg); }
  80% { transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(1deg); }
}

.aura {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 160px;
  height: 160px;
  margin-left: -80px;
  margin-top: -80px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--color-teal-30) 0%, transparent 65%);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--dur-long) var(--ease-soft);
  z-index: 1;
}
.aura.glowing { opacity: 1; }

/* ---------------------------------------------------------------------
 * Reduced-motion: pause the cube spin entirely, but keep the alarm
 * VISIBLE via a slow color pulse so vestibular-sensitive users still
 * see the signal. The pre-existing rule below also kills transitions,
 * so we re-enable just the alarm pulse animation explicitly.
 * --------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .anchor, .cube3d, .drift, .face, .cell, .aura {
    transition-duration: 60ms !important;
    animation: none !important;
  }
  /* Override the higher-specificity body-class spin rules.
   * The base `.drift { animation: none !important }` above gets out-
   * specificityed by `body.alarm .drift { animation: cubeDragSpin ... }`
   * (two classes vs one), so the chaos spin still fires under
   * reduced-motion. Match the offending selectors to suppress them.
   * The alarm pulse fallback below (body.alarm .face / .aura) keeps
   * the urgent signal visible without movement.
   */
  body.dragging .drift,
  body.alarm .cube3d,
  body.alarm .drift,
  body.drop-ready .drift {
    animation: none !important;
  }
  /* Re-enable a gentle pulse on alarm so the signal is still visible. */
  body.alarm .face {
    animation: cubeAlarmPulseRM 1.4s ease-in-out infinite !important;
    box-shadow: inset 0 0 0 1px var(--color-teal-30) !important;
  }
  body.alarm .aura {
    animation: cubeAlarmPulseRM 1.4s ease-in-out infinite !important;
    opacity: 0.6 !important;
  }
}
@keyframes cubeAlarmPulseRM {
  0%, 100% { box-shadow: inset 0 0 0 1px var(--color-teal-30), 0 0 8px var(--color-teal-15); }
  50%      { box-shadow: inset 0 0 0 2px var(--color-teal),    0 0 32px var(--color-teal-50); }
}

/* First-run hint pill (T2.4). New users see a small floating cube
 * with no idea what it does, what's clickable, or that they can drag
 * it. The pill appears once on first launch (gated by
 * `companion_first_run_hint_shown` in localStorage), holds for ~3
 * seconds, then auto-fades. Never shows again unless the user clears
 * localStorage. The pill's visual is a thin glass capsule above the
 * cube; it's small, low-contrast, and auto-fading — the deliberate
 * opposite of an interruptive modal. */
.first-run-hint {
  position: absolute;
  left: 50%;
  top: 14px;
  transform: translateX(-50%);
  max-width: calc(100% - 28px);
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-default);
  color: var(--color-text-primary);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 11px;
  line-height: 1.3;
  letter-spacing: 0.2px;
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.30);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  z-index: 5;
}
.first-run-hint.visible { opacity: 1; }
.first-run-hint.hidden  { opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .first-run-hint {
    transition: opacity 60ms !important;
  }
}

/* Screen-reader-only utility. The cube is a 3D CSS scene with no
 * inherent semantics for VoiceOver — every cell is a div, every face
 * is a div, the rotation conveys nothing to assistive tech. The
 * .sr-only span inside .stage carries the current state label so
 * VoiceOver users hear something meaningful. (T1.5.) */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>

<!--
  ARIA scaffolding (T1.5).
  The .stage is the live region; aria-live="polite" tells VoiceOver
  to announce text changes inside it without interrupting the user.
  aria-atomic="true" forces the entire region to re-read on change.
  The role="status" gives VoiceOver a meaningful type ("status
  announcement") rather than a generic group.

  Inside, the .sr-only span carries the current state semantics
  (#companion-state-label: state name OR alarm string when active).
  The cube divs themselves are aria-hidden because their visual
  language doesn't translate (a CSS rotation conveys nothing to
  assistive tech).
-->
<div class="stage" role="status" aria-live="polite" aria-atomic="true" aria-label="Carrel companion">
  <span class="sr-only" id="companion-state-label">Idle.</span>
  <!-- First-run hint (T2.4). aria-hidden because the .stage live
       region already announces the state; the hint is decorative
       guidance for sighted users only. -->
  <div class="first-run-hint" id="firstRunHint" aria-hidden="true">
    Drop a PDF · Click for full app · Drag to move
  </div>
  <div class="aura" id="aura" aria-hidden="true"></div>
  <div class="anchor" id="anchor" aria-hidden="true">
    <div class="cube3d" id="cube3d">
      <div class="drift" id="drift">
        <div class="face face-front"  data-face="front"></div>
        <div class="face face-back"   data-face="back"></div>
        <div class="face face-right"  data-face="right"></div>
        <div class="face face-left"   data-face="left"></div>
        <div class="face face-top"    data-face="top"></div>
        <div class="face face-bottom" data-face="bottom"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ---------------------------------------------------------------------
 * Companion cube — state machine, behaviors, drag bridge.
 *
 * State invariants:
 *   * `currentState` is one of STATES keys; the only mutator is
 *     `applyState(name)`. Unknown names log a warning + console.warn
 *     and no-op (was: silent return — caught a real audit finding).
 *   * `activeTimers` tracks every setTimeout id we've issued; on
 *     state change we clear the whole set and on individual timer
 *     fire we remove from the set. Bounded by behavior cadence.
 *   * `body.alarm` is orthogonal to currentState — alarm + state
 *     animations stack intentionally (urgency wins).
 *
 * Drag bridge invariants:
 *   * Pointerdown captures `dragOriginScreen`. `lastPostedDx/Dy` is
 *     the cumulative delta we've already informed Swift about.
 *   * Each pointermove posts the *increment* since lastPosted, which
 *     gives Swift's setFrameOrigin a clean per-event delta even when
 *     events are coalesced or dropped.
 *   * Threshold is measured from origin (not per-event), so slow
 *     drags accumulate to threshold cleanly.
 *   * Pointerup OR window blur OR mouseleave-document all end the
 *     drag — covers the "release outside the panel" case which the
 *     prior pointercancel-only approach missed.
 * ------------------------------------------------------------------ */

const TIMING = {
  idleTwinkleStartMs: 1500,
  idleTwinkleHoldMs: 700,
  idleTwinkleNextMin: 2200,
  idleTwinkleNextRandom: 1800,
  /* T2.3 — ambientCellMs is the per-pulse hold time used by
   * pulseFace(). The pre-T2.3 ambient*Start/Next* entries scheduled
   * the now-removed random recurring ambient and are gone. */
  ambientCellMs: 1700,
  focusPulseHoldMs: 320,
  focusPulseNextMs: 1600,
  focusPulseStaggerMs: 220,
  thinkPulseHoldMs: 260,
  thinkPulseNextMs: 1700,
  thinkPulseStaggerMs: 200,
  citeScanCellMs: 220,
  citeScanStaggerMs: 90,
  citeScanNextMs: 1300,
  cardGoodStaggerMs: 60,
  cardGoodSettleMs: 700,
  breakDrainStaggerMs: 180,
  sleepGlimmerStartMs: 4000,
  sleepGlimmerHoldMs: 1400,
  sleepGlimmerNextMin: 8000,
  sleepGlimmerNextRandom: 4000,
  shakeRecoveryMs: 700,
  auraReleaseMs: 2400,
  behaviorWarmupMs: 450,
};

/* All faces share the same calm diamond pattern as the base. The
 * differentiation comes from the active-state animation, not noisy
 * static cells. (Audit finding F: left face used to have an asymmetric
 * 4-bright pattern that read as sloppy when rotated into view.) */
const DIAMOND = ['.', 'o', '.',  'o', 'b', 'o',  '.', 'o', '.'];
const FACE_DEFAULTS = {
  front:  DIAMOND,
  top:    ['.', 'b', '.',  '.', 'b', '.',  '.', 'b', '.'],
  right:  ['o', '.', 'o',  '.', 'b', '.',  'o', '.', 'o'],
  back:   ['.', '.', '.',  '.', 'o', '.',  '.', '.', '.'],
  left:   DIAMOND,
  bottom: ['b', '.', 'b',  '.', 'b', '.',  'b', '.', 'b'],
};
const CELL_CLASS      = { '.': '', o: 'outlined',      f: 'filled',      b: 'bright',      d: 'dim' };
const CELL_CLASS_TEAL = { '.': '', o: 'teal-outlined', f: 'teal-filled', b: 'teal-bright', d: 'teal-dim' };

const STATES = {
  idle:         { rotateX: -14, rotateY:  -18, activeFace: 'front',  scale: 1,    opacity: 1,    behavior: 'idleTwinkle',  drift: true },
  focused:      { rotateX: -78, rotateY:  -18, activeFace: 'top',    scale: 1.05, opacity: 1,    behavior: 'focusColumn'  },
  thinking:     { rotateX: -14, rotateY:  -78, activeFace: 'right',  scale: 1,    opacity: 1,    behavior: 'thinkSweep'   },
  citeChecking: { rotateX:  -8, rotateY:  -98, activeFace: 'right',  scale: 1,    opacity: 1,    behavior: 'citeScan' },
  encouraging:  { rotateX: -14, rotateY:   80, activeFace: 'left',   scale: 1.04, opacity: 1,    behavior: 'cardGood',     auraOnEntry: true },
  stumped:      { rotateX: -14, rotateY:   80, activeFace: 'left',   scale: 0.98, opacity: 1,    behavior: 'cardAgain',    shakeOnEntry: true },
  break:        { rotateX: -14, rotateY:  168, activeFace: 'back',   scale: 0.96, opacity: 0.95, behavior: 'breakDrain' },
  sleeping:     { rotateX:  78, rotateY:  -18, activeFace: 'bottom', scale: 0.92, opacity: 0.7,  behavior: 'sleepGlimmer', drift: true },
};

const faces = {};
document.querySelectorAll('.face').forEach((face) => {
  const name = face.dataset.face;
  faces[name] = face;
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.face = name;
    cell.dataset.idx = String(i);
    face.appendChild(cell);
  }
});

const anchor = document.getElementById('anchor');
const cube3d = document.getElementById('cube3d');
const drift = document.getElementById('drift');
const aura = document.getElementById('aura');

let currentState = 'idle';

/* Bounded timer registry. setT() wraps setTimeout so fired timers
 * remove themselves from the registry — the array can't grow without
 * bound during long idle states. (Audit finding H.) */
const activeTimers = new Set();
function setT(fn, ms) {
  const id = setTimeout(() => {
    activeTimers.delete(id);
    fn();
  }, ms);
  activeTimers.add(id);
  return id;
}
function clearAllTimers() {
  activeTimers.forEach(clearTimeout);
  activeTimers.clear();
}

function applyPattern(faceName, pattern, useTeal) {
  const cells = faces[faceName].children;
  const map = useTeal ? CELL_CLASS_TEAL : CELL_CLASS;
  for (let i = 0; i < 9; i++) {
    const cell = cells[i];
    cell.className = 'cell';
    const cls = map[pattern[i]];
    if (cls) cell.classList.add(cls);
  }
}

function applyAllPatterns(activeFace) {
  Object.keys(FACE_DEFAULTS).forEach((name) => {
    applyPattern(name, FACE_DEFAULTS[name], name === activeFace);
  });
  Object.values(faces).forEach((f) => f.classList.remove('active-face'));
  if (faces[activeFace]) faces[activeFace].classList.add('active-face');
}

/* T2.3 — every pulse is a real signal, not decoration.
 *
 * Pre-T2.3 behavior: startAmbient() picked a random cell on a random
 * inactive face every 3.5-6s and animated it. This was DESIGN.md-
 * forbidden ("avoid decorative ambient motion") and the pulses
 * carried zero information.
 *
 * New behavior: random ambient is removed. The cube is still on
 * inactive faces by default. Specific app events trigger a pulse on
 * a specific face via `pulseFace(name)`, exposed on
 * `window.companion`. Each pulse means something concrete happened:
 *   - left:   library / SRS background activity (e.g. document
 *             indexed, card scheduled)
 *   - right:  AI background activity in another tab
 *   - back:   periodic sync (calendar, telemetry batch)
 *   - top:    session progress milestone
 *   - bottom: low-priority background (scratch buffer flush)
 *   - front:  reserved (active-face for idle; do not pulse here)
 *
 * The face → domain mapping is a convention, not enforced. Callers
 * pick the face that best represents the signal's domain. The
 * mechanism only animates one cell on the named face for
 * ambientCellMs; it does not schedule recurring pulses.
 *
 * This commit ships the mechanism. Wiring real event sources to
 * pulseFace() lands in follow-up commits as we audit each event
 * emitter. Until those wires exist, inactive faces stay still. */
function pulseFace(faceName) {
  const face = faces[faceName];
  if (!face) return;
  const cells = face.children;
  if (!cells.length) return;
  const idx = Math.floor(Math.random() * cells.length);
  const cell = cells[idx];
  if (!cell) return;
  cell.classList.add('ambient');
  setT(() => cell.classList.remove('ambient'), TIMING.ambientCellMs);
}

const BEHAVIORS = {
  idleTwinkle() {
    /* Front face has 9 cells (0..8). Twinkle skips index 4 (the
     * always-bright center, per FACE_DEFAULTS). Pre-T2.5 this list
     * also carved out 6/7/8 for the streak overlay; streak is gone,
     * so all 8 non-center positions are fair game again. */
    const ALL_POS = [0, 1, 2, 3, 5, 6, 7, 8];
    function tick() {
      if (currentState !== 'idle') return;
      const pos = ALL_POS[Math.floor(Math.random() * ALL_POS.length)];
      const cell = faces.front.children[pos];
      const orig = cell.className;
      cell.className = 'cell teal-bright';
      setT(() => { cell.className = orig; }, TIMING.idleTwinkleHoldMs);
      setT(tick, TIMING.idleTwinkleNextMin + Math.random() * TIMING.idleTwinkleNextRandom);
    }
    setT(tick, TIMING.idleTwinkleStartMs);
  },
  focusColumn() {
    const cells = faces.top.children;
    [1, 4, 7].forEach((i) => cells[i].className = 'cell teal-filled');
    [0, 2, 3, 5, 6, 8].forEach((i) => cells[i].className = 'cell');
    function pulse() {
      if (currentState !== 'focused') return;
      [1, 4, 7].forEach((idx, n) => {
        setT(() => {
          if (currentState !== 'focused') return;
          cells[idx].className = 'cell teal-bright';
          setT(() => { cells[idx].className = 'cell teal-filled'; }, TIMING.focusPulseHoldMs);
        }, n * TIMING.focusPulseStaggerMs);
      });
      setT(pulse, TIMING.focusPulseNextMs);
    }
    pulse();
  },
  thinkSweep() {
    const cells = faces.right.children;
    const seq = [0, 8, 2, 6, 4];
    function pulse() {
      if (currentState !== 'thinking') return;
      seq.forEach((idx, n) => {
        setT(() => {
          if (currentState !== 'thinking') return;
          const old = cells[idx].className;
          cells[idx].className = 'cell teal-bright';
          setT(() => { cells[idx].className = old; }, TIMING.thinkPulseHoldMs);
        }, n * TIMING.thinkPulseStaggerMs);
      });
      setT(pulse, TIMING.thinkPulseNextMs);
    }
    pulse();
  },
  citeScan() {
    const cells = faces.right.children;
    function scan() {
      if (currentState !== 'citeChecking') return;
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const idx = row * 3 + col;
          setT(() => {
            if (currentState !== 'citeChecking') return;
            const old = cells[idx].className;
            cells[idx].className = 'cell teal-bright';
            setT(() => { cells[idx].className = old; }, TIMING.citeScanCellMs);
          }, (row * 3 + col) * TIMING.citeScanStaggerMs);
        }
      }
      setT(scan, TIMING.citeScanNextMs);
    }
    scan();
  },
  cardGood() {
    const cells = faces.left.children;
    const order = [0, 1, 2, 5, 8, 7, 6, 3, 4];
    order.forEach((idx, n) => {
      setT(() => { cells[idx].className = 'cell teal-bright'; }, n * TIMING.cardGoodStaggerMs);
    });
    setT(() => {
      if (currentState !== 'encouraging') return;
      const pat = FACE_DEFAULTS.left;
      for (let i = 0; i < 9; i++) {
        if (i === 2 || i === 5) cells[i].className = 'cell teal-bright';
        else cells[i].className = 'cell ' + (CELL_CLASS_TEAL[pat[i]] || '');
      }
    }, TIMING.cardGoodSettleMs);
  },
  cardAgain() {
    const cells = faces.left.children;
    for (let i = 8; i >= 0; i--) {
      if (cells[i].classList.contains('teal-bright')) {
        cells[i].className = 'cell teal-outlined';
        return;
      }
    }
  },
  breakDrain() {
    const cells = faces.back.children;
    [4, 1, 3, 5, 7, 0, 2, 6, 8].forEach((idx, n) => {
      setT(() => { cells[idx].className = 'cell dim'; }, n * TIMING.breakDrainStaggerMs);
    });
  },
  sleepGlimmer() {
    const cells = faces.bottom.children;
    for (let i = 0; i < 9; i++) {
      if (FACE_DEFAULTS.bottom[i] === 'b') cells[i].className = 'cell dim';
    }
    function glimmer() {
      if (currentState !== 'sleeping') return;
      const idx = Math.floor(Math.random() * 9);
      const old = cells[idx].className;
      cells[idx].className = 'cell teal-filled';
      setT(() => { cells[idx].className = old; }, TIMING.sleepGlimmerHoldMs);
      setT(glimmer, TIMING.sleepGlimmerNextMin + Math.random() * TIMING.sleepGlimmerNextRandom);
    }
    setT(glimmer, TIMING.sleepGlimmerStartMs);
  },
};

/* Human-readable labels for VoiceOver. Mirror keys with STATES.
 * Kept here (not in STATES) so the visual config and the
 * accessibility config can evolve independently — adding a state
 * to STATES without a label here will gracefully fall back to the
 * raw state name. (T1.5.) */
const STATE_LABELS = {
  idle: 'Idle',
  focused: 'Focused on a study session',
  thinking: 'Thinking',
  citeChecking: 'Verifying citations',
  encouraging: 'Card answered correctly',
  stumped: 'Card needs review',
  break: 'On break',
  sleeping: 'Sleeping. No recent activity.',
};

function announceCompanion() {
  /* Recompose the live-region label from current state + alarm.
   * Alarm is the highest-priority signal so it leads; otherwise the
   * label is the current state from STATE_LABELS. (T1.5.) */
  const label = document.getElementById('companion-state-label');
  if (!label) return;
  if (alarmActive) {
    label.textContent = 'Study session starting now. Click to dismiss.';
    return;
  }
  label.textContent = (STATE_LABELS[currentState] || currentState) + '.';
}

function applyState(name) {
  const cfg = STATES[name];
  if (!cfg) {
    /* Audit finding D: silent fallback used to swallow typo'd state
     * names from the Swift bridge. Surface via console + a log
     * message to the host so the issue is visible in WKWebView's
     * console + Swift's os.log. */
    console.warn('[companion] unknown state:', name);
    postShell({ action: 'log', level: 'warn', event: 'unknown_state', name: String(name) });
    return;
  }
  currentState = name;
  clearAllTimers();

  cube3d.style.setProperty('--rx', cfg.rotateX + 'deg');
  cube3d.style.setProperty('--ry', cfg.rotateY + 'deg');
  cube3d.style.transition = `transform var(--dur-long) var(--ease-soft)`;
  cube3d.style.transform = `rotateX(${cfg.rotateX}deg) rotateY(${cfg.rotateY}deg)`;
  anchor.style.transform = `scale(${cfg.scale})`;
  anchor.style.opacity = String(cfg.opacity);

  applyAllPatterns(cfg.activeFace);

  if (cfg.drift) drift.classList.add('spinning');
  else drift.classList.remove('spinning');

  if (cfg.auraOnEntry) {
    aura.classList.add('glowing');
    setT(() => aura.classList.remove('glowing'), TIMING.auraReleaseMs);
  } else {
    aura.classList.remove('glowing');
  }

  if (cfg.shakeOnEntry) {
    cube3d.style.animation = 'cubeStumpedShake var(--spin-shake) var(--ease-out)';
    setT(() => { cube3d.style.animation = ''; }, TIMING.shakeRecoveryMs);
  }

  if (BEHAVIORS[cfg.behavior]) {
    setT(() => BEHAVIORS[cfg.behavior](), TIMING.behaviorWarmupMs);
  }
  /* T2.3 — random ambient pulses removed; pulseFace() is now the
   * only way an inactive face animates, and it's caller-driven. */

  /* T1.5 — announce the new state to VoiceOver. */
  announceCompanion();
}

let alarmActive = false;
window.companion = {
  setState(name) { applyState(name); },
  getState() { return currentState; },
  /** Animate a single random cell on the named face once. Used by
   *  the bus to translate real app events into "something happened
   *  in this domain" pulses. Names: front, back, left, right, top,
   *  bottom. Unknown names are silently dropped. (T2.3.) */
  pulseFace(name) { pulseFace(String(name || '')); },
  /** Toggle drop-target visual state. Swift's DropAcceptingWebView
   *  calls this on dragEntered / dragExited / performDragOperation. */
  setDropping(active) {
    document.body.classList.toggle('drop-ready', !!active);
    if (active) aura.classList.add('glowing');
    else aura.classList.remove('glowing');
  },
  /** Alarm — orthogonal to STATES. Swift drives this when a
   *  scheduled study session is due. Tap on the panel dismisses
   *  (Swift posts {action:'tap'} which the host treats as ack). */
  setAlarm(active) {
    alarmActive = !!active;
    document.body.classList.toggle('alarm', alarmActive);
    /* T1.5 — when alarm goes active, announceCompanion replaces the
     * state label with the urgent string. When alarm clears, the
     * announcer re-falls-through to the current state label. */
    announceCompanion();
  },
  isAlarming() { return alarmActive; },
};

/* Visibility change: pause animations on the cube + aura only.
 * (Audit finding K: querying * was a code smell, not a perf issue
 * here, but tightening the selector pins the contract.) */
const ANIMATABLE_SELECTOR = '.face, .cell, .cube3d, .drift, .anchor, .aura';
document.addEventListener('visibilitychange', () => {
  document.querySelectorAll(ANIMATABLE_SELECTOR).forEach((el) => {
    try {
      el.getAnimations().forEach((a) => document.hidden ? a.pause() : a.play());
    } catch (e) { /* getAnimations not supported */ }
  });
});

applyState('idle');

/* First-run hint (T2.4). Show the "Drop a PDF · Click for full app
 * · Drag to move" pill once on first ever launch, then never again.
 * Gated by localStorage so it survives across launches but not across
 * a fresh install (acceptable — first-install hint should re-show
 * for genuine first-installs).
 *
 * Failure modes intentionally treated as "show the hint":
 *   - localStorage unavailable (private browsing flags etc): the
 *     hint shows. Worst case the user sees it twice. Better than
 *     never seeing it.
 *   - flag write fails after read: same, hint re-shows next launch.
 */
(function maybeShowFirstRunHint() {
  const HINT_KEY = 'companion_first_run_hint_shown';
  let alreadyShown = false;
  try { alreadyShown = window.localStorage.getItem(HINT_KEY) === '1'; }
  catch (_) { alreadyShown = false; }
  if (alreadyShown) return;

  const hint = document.getElementById('firstRunHint');
  if (!hint) return;

  /* Defer one frame so the .visible class transition fires (CSS
   * transitions don't run on initial paint; need an opacity 0 → 1
   * delta in a subsequent frame). */
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      hint.classList.add('visible');
    });
  });

  /* Hold for 2.6s, fade for 400ms, then remove. The total window is
   * ~3 seconds. Auto-fade is unconditional — no click-to-dismiss; the
   * pill is non-interactive (pointer-events: none). */
  setT(() => {
    hint.classList.remove('visible');
    hint.classList.add('hidden');
  }, 2600);
  setT(() => {
    if (hint.parentNode) hint.parentNode.removeChild(hint);
  }, 3100);

  try { window.localStorage.setItem(HINT_KEY, '1'); }
  catch (_) { /* storage rejected the write; will re-show next launch */ }
})();

/* =====================================================================
 * Drag + tap bridge.
 *
 * WKWebView swallows mouse events before they reach the NSPanel, so
 * the panel's built-in isMovableByWindowBackground does nothing here.
 * We capture pointer events in JS and post incremental deltas to the
 * "companionShell" handler; Swift moves the panel via setFrameOrigin.
 * A short, threshold-gated mousedown→mouseup with no movement fires
 * a "tap" instead of a drag.
 *
 * Hardened invariants (audit findings A, G, H):
 *   * Threshold is measured against `dragOriginScreen` (set on
 *     pointerdown) — slow drags accumulate cleanly, even when each
 *     individual pointermove is sub-threshold.
 *   * Posted deltas are the *increment* from `lastPostedScreen` —
 *     when pointer events get coalesced, this remains accurate.
 *   * Window blur AND document mouseleave AND pointerup AND
 *     pointercancel all end the drag — covers releases outside the
 *     panel that pointercancel doesn't always report.
 * ===================================================================== */
const shellBridge = window.webkit?.messageHandlers?.companionShell;
function postShell(payload) {
  try { shellBridge?.postMessage(payload); }
  catch (e) { console.error('companionShell bridge failed', e); }
}

const DRAG_THRESHOLD_PX = 3;
let dragActive = false;
let dragMoved = false;
let dragOriginScreen = null;
let lastPostedScreen = null;

window.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  dragActive = true;
  dragMoved = false;
  dragOriginScreen = { x: e.screenX, y: e.screenY };
  lastPostedScreen = { x: e.screenX, y: e.screenY };
});

window.addEventListener('pointermove', (e) => {
  if (!dragActive) return;
  /* Threshold from origin: cumulative distance, not per-event delta.
   * Slow drags that move 1px per event still cross the threshold at
   * the third pixel. */
  const totalDx = e.screenX - dragOriginScreen.x;
  const totalDy = e.screenY - dragOriginScreen.y;
  if (!dragMoved) {
    if (Math.hypot(totalDx, totalDy) < DRAG_THRESHOLD_PX) return;
    dragMoved = true;
    document.body.classList.add('dragging');
    postShell({ action: 'dragStart' });
  }
  /* Increment from the last posted position, not from the previous
   * pointermove. This stays correct even if WebKit coalesces events
   * (every coalesced sample is reported, so total stays accurate). */
  const dx = e.screenX - lastPostedScreen.x;
  const dy = e.screenY - lastPostedScreen.y;
  if (dx !== 0 || dy !== 0) {
    postShell({ action: 'dragMove', dx, dy });
    lastPostedScreen = { x: e.screenX, y: e.screenY };
  }
});

function endDrag() {
  if (!dragActive) return;
  const moved = dragMoved;
  dragActive = false;
  dragMoved = false;
  dragOriginScreen = null;
  lastPostedScreen = null;
  document.body.classList.remove('dragging');
  if (moved) postShell({ action: 'dragEnd' });
  else postShell({ action: 'tap' });
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
/* Window-level fallbacks for the case where the user releases the
 * mouse outside the panel — pointerup may not fire if the cursor has
 * left the WKWebView's hit-testable region. (Audit finding G.) */
window.addEventListener('blur', endDrag);
document.addEventListener('mouseleave', endDrag);
</script>
</body>
</html>
