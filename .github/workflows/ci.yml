name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

# Scope GITHUB_TOKEN to the minimum every job here needs: read-only
# access to repo contents (for actions/checkout). No job writes to the
# repo, comments on PRs, or publishes artifacts to a registry, so
# nothing needs more. A job can add its own `permissions:` block to
# override if that ever changes.
permissions:
  contents: read

# Pin fastembed's model cache to a cacheable directory so the embedding model
# (BAAI/bge-small-en-v1.5) is fetched once and reused via actions/cache instead
# of being re-downloaded from HuggingFace on every run. That flaky download was
# the top cause of non-deterministic python-tests / evals failures.
env:
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy --config-file mypy.ini
      - name: Validate prompt catalog
        run: python script/validate_prompts.py

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Warm embedding model
        uses: ./.github/actions/warm-embedding-model
      - name: Maintained blocking test suites
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python -m unittest \
            tests.test_ai_router \
            tests.test_calendar_secrets \
            tests.test_einstein_tutor \
            tests.test_evals_runner \
            tests.test_local_api_token \
            tests.test_logging_redaction \
            tests.test_phase0_foundation \
            tests.test_phase0_batch_b \
            tests.test_repository_hygiene \
            tests.test_tutor_grounded \
            tests.test_upload_dedupe \
            tests.test_upload_security \
            tests.test_usage_events \
            tests.test_db_migrations \
            tests.test_verify \
            tests.test_verify_stream \
            tests.test_quote_check \
            tests.test_t1_offline_model \
            tests.test_align \
            tests.test_briefs \
            tests.test_briefs_routes \
            -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Lint frontend
        run: pnpm lint
      - name: Build macOS frontend bundle
        run: pnpm build:macos
      - name: Test frontend
        run: pnpm test

  memory-pressure-ubuntu:
    # Cross-platform validation gate for services/ingestion/memory_pressure.py
    # (shipped in PR #80, T2-redux + T3-redux). The helper dispatches to a
    # macOS-only vm_stat + sysctl path on darwin and a psutil fallback
    # everywhere else. This job exercises the psutil branch on Linux with the
    # dispatcher forced via CARREL_FORCE_PSUTIL_MEMORY=1 so a regression on
    # the cross-platform path surfaces before it reaches macOS users via the
    # adaptive worker-count helper. Blocking; psutil ships in requirements-dev.txt.
    runs-on: ubuntu-latest
    env:
      CARREL_FORCE_PSUTIL_MEMORY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run memory-pressure tests with psutil path forced
        run: python -m unittest tests.test_memory_pressure -v

  legacy-learning-os-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Warm embedding model
        uses: ./.github/actions/warm-embedding-model
      - name: Advisory legacy LearningOS tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest tests.test_learning_os -v

  evals-smoke-schema:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Warm embedding model
        uses: ./.github/actions/warm-embedding-model
      - name: Run blocking smoke evals
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m evals.run_evals --suite smoke --mode smoke
      - name: Upload eval smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-smoke
          path: evals/reports/*

  evals-full:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Warm embedding model
        uses: ./.github/actions/warm-embedding-model
      - name: Run advisory full evals
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m evals.run_evals --suite smoke --mode full
      - name: Upload eval full reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-full
          path: evals/reports/*

  benchmark-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Warm embedding model
        uses: ./.github/actions/warm-embedding-model
      - name: Run advisory benchmark smoke
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python -m benchmarks.phase0 \
            --output data/benchmarks/ci-latest.json \
            --compare data/benchmarks/baseline.json \
            --tolerance 0.25
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-phase0
          path: data/benchmarks/ci-latest.json

  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          swift --version
          xcode-select -p
      - name: Build required Swift targets
        # EinsteinDesktop + EinsteinIngestionBridge must build on any
        # toolchain. Building them on their own guarantees an optional
        # target can never abort the core build (the install bug fixed
        # on fix/afm-bridge-optional-build, where EinsteinAFMBridge's
        # FoundationModels macros broke the whole build on Macs that had
        # only the Command Line Tools, not full Xcode).
        run: |
          swift build --package-path macos-app \
            --product EinsteinDesktop \
            --product EinsteinIngestionBridge
      - name: Build EinsteinAFMBridge without the FoundationModels macro plugin
        # Regression guard. Without -DCARREL_AFM the @Generable / @Guide
        # path is compiled out, so the AFM bridge must build on a
        # toolchain that lacks the FoundationModelsMacros plugin. If this
        # step fails, an unguarded macro has been reintroduced.
        run: swift build --package-path macos-app --product EinsteinAFMBridge
      - name: Build EinsteinAFMBridge with Apple Intelligence enabled
        run: |
          swift build --package-path macos-app \
            --product EinsteinAFMBridge -Xswiftc -DCARREL_AFM
      - name: Swift tests
        run: swift test --package-path macos-app
