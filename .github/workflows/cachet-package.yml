name: Cachet desktop package

# Builds the bundled, double-click Cachet app for Windows + macOS. PyInstaller
# can't cross-compile, so each binary is built on its own OS runner. Run manually
# (workflow_dispatch) to get downloadable artifacts, or push a `cachet-v*` tag to
# publish a GitHub Release. See docs/plans/cachet-localhost-browser-2026-06-05.md.
#
# NOTE: binaries are UNSIGNED. First launch shows a SmartScreen / Gatekeeper
# warning until code-signing certs are set up (Phase 4).

on:
  workflow_dispatch:
  push:
    branches:
      # Build the bundle when this delivery branch is pushed (workflow_dispatch
      # only fires from the default branch, so a branch trigger is how we get a
      # downloadable Windows artifact before this lands on main). Remove once the
      # workflow is on main and dispatch/tags suffice.
      - "claude/nostalgic-mclaren-93d91a"
    tags:
      - "cachet-v*"

permissions:
  contents: write # the release job attaches binaries

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Cachet-windows
          - os: macos-latest
            artifact: Cachet-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Mirror ci.yml: pnpm/action-setup honors the pnpm@9.12.0 pin in
      # package.json (corepack alone pulled the latest pnpm 11, which needs
      # Node >=22.13 / node:sqlite and crashes). Node 22 matches ci.yml.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Cachet frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build:cachet

      - name: Install package deps (core only)
        run: pip install -r packaging/requirements-package.txt

      - name: Freeze with PyInstaller
        run: pyinstaller --clean --noconfirm packaging/cachet.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          name: "Cachet ${{ github.ref_name }} (pre-release)"
          # Pre-release: the binaries build in CI but are not yet runtime-verified
          # on a clean Windows install and are unsigned. Promote to a full release
          # after a smoke test on real hardware.
          prerelease: true
          body: |
            Bundled Cachet desktop builds (Windows + macOS). Early pre-release.

            ## Run it
            - **Windows:** download `Cachet.exe`, double-click. "Windows protected
              your PC" -> **More info** -> **Run anyway** (unsigned). Cachet opens
              in your browser.
            - **macOS:** download `Cachet`, then right-click -> **Open** -> **Open**
              (unidentified developer).

            ## Scope
            Deterministic verification only: load a DOCX or digital PDF as the
            record, paste an AI's claims, and Cachet flags any quote that is not
            verbatim and any citation it cannot resolve. Scanned-PDF OCR and
            model-graded grounding are not in this build.

            UNSIGNED + early: expect a first-launch security prompt. Code signing
            and a clean-machine smoke test come before this is promoted to stable.
